<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMate - Smart Student Planner</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f7f7fc;
  color: #25263a;
  min-height: 100vh;
}

.background-pattern {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
  opacity: .07;
  background-color: #f7f7fc;
  background-image:
    radial-gradient(circle at 20px 20px, #7568df 2px, transparent 3px);
  background-size: 45px 45px;
}

.container {
  max-width: 1050px;
  margin: auto;
  padding: 20px;
}

/* HEADER */

header {
  background: linear-gradient(120deg, #594bd6, #8376ef);
  color: white;
  padding: 27px 20px;
}

header h1 {
  font-size: 27px;
  margin-bottom: 6px;
}

header p {
  color: #eeedff;
  font-size: 14px;
}

/* CARDS */

.card {
  background: #fff;
  border: 1px solid #eaeaf2;
  border-radius: 13px;
  padding: 20px;
  margin-bottom: 17px;
  box-shadow: 0 3px 15px rgba(30,30,70,.035);
}

h2 {
  font-size: 18px;
  margin-bottom: 16px;
  color: #292a40;
}

.muted {
  color: #85869a;
  font-size: 13px;
}

/* STATISTICS */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 13px;
  margin-bottom: 17px;
}

.stat {
  background: white;
  padding: 17px;
  border: 1px solid #eaeaf2;
  border-radius: 12px;
}

.stat small {
  color: #85869a;
}

.stat strong {
  display: block;
  color: #6558d9;
  font-size: 27px;
  margin-top: 7px;
}

/* INPUTS */

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #e2e2ec;
  border-radius: 8px;
  background: white;
  color: #292a40;
  font-size: 14px;
  outline: none;
}

input:focus, select:focus {
  border-color: #7669df;
}

.form-row {
  display: flex;
  gap: 10px;
  margin-bottom: 11px;
}

.form-row input:first-child {
  flex: 1;
  min-width: 0;
}

/* BUTTONS */

button {
  border: none;
  border-radius: 8px;
  padding: 11px 15px;
  background: #6558d9;
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #5043c1;
}

.secondary {
  background: #f0efff;
  color: #5d50c8;
}

.secondary:hover {
  background: #e5e2ff;
}

.danger {
  background: #fff0f0;
  color: #c34444;
}

.danger:hover {
  background: #ffe0e0;
}

/* SUBJECTS */

.subject-list {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 14px;
}

.subject-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 11px;
  border-radius: 8px;
  background: #f3f2ff;
  color: #5145b7;
  font-size: 13px;
}

.subject-chip button {
  background: transparent;
  color: #a04b55;
  padding: 0;
  font-size: 17px;
}

/* TASKS */

.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #eeeef3;
}

.task:last-child {
  border-bottom: none;
}

.task input[type="checkbox"] {
  width: 17px;
  height: 17px;
  accent-color: #6558d9;
}

.task-title {
  flex: 1;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.task.done .task-title {
  text-decoration: line-through;
  color: #999;
}

.task-info {
  color: #77758d;
  background: #f2f1ff;
  padding: 5px 8px;
  font-size: 11px;
  border-radius: 6px;
}

.task-delete {
  padding: 7px 10px;
  font-size: 12px;
}

.empty {
  text-align: center;
  color: #999;
  padding: 22px 8px;
  font-size: 13px;
}

/* PROGRESS */

.progress {
  height: 9px;
  background: #eeeef5;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 11px;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: #6558d9;
  transition: width .3s;
}

.progress-text {
  font-size: 13px;
  color: #77758d;
}

/* FOOTER */

footer {
  text-align: center;
  color: #9292a3;
  font-size: 12px;
  padding: 22px;
}

/* MOBILE */

@media(max-width: 600px) {
  .container {
    padding: 13px;
  }

  header h1 {
    font-size: 23px;
  }

  .stats {
    gap: 7px;
  }

  .stat {
    padding: 12px 9px;
  }

  .stat strong {
    font-size: 22px;
  }

  .form-row {
    flex-direction: column;
  }

  .task {
    flex-wrap: wrap;
  }

  .task-info {
    margin-left: 25px;
  }
}
</style>
</head>

<body>

<div class="background-pattern"></div>

<header>
  <div class="container">
    <h1>StudyMate</h1>
    <p>Your Personal Study Planner</p>
  </div>
</header>

<main class="container">

  <!-- DASHBOARD -->

  <section class="stats">

    <div class="stat">
      <small>Total Tasks</small>
      <strong id="total">0</strong>
    </div>

    <div class="stat">
      <small>Completed</small>
      <strong id="completed">0</strong>
    </div>

    <div class="stat">
      <small>Remaining</small>
      <strong id="remaining">0</strong>
    </div>

  </section>

  <!-- PROGRESS -->

  <section class="card">

    <h2>Study Progress</h2>

    <div class="progress-text" id="progressText">
      0% completed
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </section>

  <!-- SUBJECT MANAGEMENT -->

  <section class="card">

    <h2>My Subjects</h2>

    <p class="muted">
      Add your own subjects. You can choose any name you want.
    </p>

    <form id="subjectForm" style="margin-top:15px">

      <div class="form-row">

        <input
          id="newSubject"
          type="text"
          placeholder="Enter subject name..."
          maxlength="40"
          required
        >

        <button type="submit">
          + Add Subject
        </button>

      </div>

    </form>

    <div class="subject-list" id="subjectList"></div>

  </section>

  <!-- ADD HOMEWORK -->

  <section class="card">

    <h2>Add Homework Task</h2>

    <form id="taskForm">

      <div class="form-row">

        <input
          id="taskInput"
          type="text"
          placeholder="What do you need to study?"
          maxlength="120"
          required
        >

      </div>

      <div class="form-row">

        <select id="subjectSelect" required>
          <option value="">Select a subject</option>
        </select>

        <input
          id="dateInput"
          type="date"
          aria-label="Due date"
        >

      </div>

      <button type="submit">Add Task</button>

    </form>

  </section>

  <!-- TASK LIST -->

  <section class="card">

    <h2>My Homework</h2>

    <div id="taskList"></div>

    <button
      class="danger"
      id="clearDone"
      type="button"
      style="margin-top:15px"
    >
      Clear Completed
    </button>

  </section>

</main>

<footer>
  StudyMate · Your Personal Study Space
</footer>

<script>

/* STORAGE */

function loadData(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  } catch {
    return fallback;
  }
}

let subjects = loadData("sm_subjects", []);
let tasks = loadData("sm_tasks", []);

if (!Array.isArray(subjects)) subjects = [];
if (!Array.isArray(tasks)) tasks = [];

const $ = id => document.getElementById(id);

/* SAVE */

function saveAll() {
  localStorage.setItem("sm_subjects", JSON.stringify(subjects));
  localStorage.setItem("sm_tasks", JSON.stringify(tasks));
}

/* ADD SUBJECT */

$("subjectForm").addEventListener("submit", event => {

  event.preventDefault();

  const name = $("newSubject").value.trim();

  if (!name) return;

  const exists = subjects.some(
    subject => subject.toLowerCase() === name.toLowerCase()
  );

  if (exists) {
    alert("This subject already exists.");
    return;
  }

  subjects.push(name);

  $("newSubject").value = "";

  saveAll();
  renderSubjects();

});

/* DELETE SUBJECT */

function deleteSubject(name) {

  const used = tasks.some(task => task.subject === name);

  if (used) {
    alert("This subject has tasks. Delete or change those tasks first.");
    return;
  }

  subjects = subjects.filter(subject => subject !== name);

  saveAll();
  renderSubjects();

}

/* SHOW SUBJECTS */

function renderSubjects() {

  const list = $("subjectList");
  const select = $("subjectSelect");

  list.innerHTML = "";
  select.innerHTML = '<option value="">Select a subject</option>';

  if (subjects.length === 0) {
    list.innerHTML =
      '<div class="empty">No subjects added yet.</div>';
  }

  subjects.forEach(name => {

    const chip = document.createElement("div");
    chip.className = "subject-chip";

    const label = document.createElement("span");
    label.textContent = name;

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "×";
    remove.title = "Remove subject";

    remove.addEventListener("click", () => {
      deleteSubject(name);
    });

    chip.append(label, remove);
    list.appendChild(chip);

    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;

    select.appendChild(option);

  });

}

/* ADD TASK */

$("taskForm").addEventListener("submit", event => {

  event.preventDefault();

  const title = $("taskInput").value.trim();
  const subject = $("subjectSelect").value;

  if (!title || !subject) {
    alert("Enter a task and select a subject.");
    return;
  }

  tasks.unshift({

    id: Date.now(),

    title: title,

    subject: subject,

    date: $("dateInput").value,

    done: false

  });

  $("taskInput").value = "";
  $("dateInput").value = "";

  saveAll();
  renderTasks();

});

/* DISPLAY TASKS */

function renderTasks() {

  const completed = tasks.filter(
    task => task.done
  ).length;

  const total = tasks.length;
  const remaining = total - completed;

  const percent = total
    ? Math.round(completed / total * 100)
    : 0;

  $("total").textContent = total;
  $("completed").textContent = completed;
  $("remaining").textContent = remaining;

  $("progressText").textContent =
    percent + "% completed";

  $("progressBar").style.width =
    percent + "%";

  const list = $("taskList");
  list.innerHTML = "";

  if (total === 0) {
    list.innerHTML =
      '<div class="empty">No homework tasks yet. Add your first task!</div>';
    return;
  }

  tasks.forEach(task => {

    const row = document.createElement("div");

    row.className =
      "task" + (task.done ? " done" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;

    checkbox.addEventListener("change", () => {
      task.done = checkbox.checked;
      saveAll();
      renderTasks();
    });

    const title = document.createElement("span");
    title.className = "task-title";
    title.textContent = task.title;

    const info = document.createElement("small");
    info.className = "task-info";

    info.textContent =
      task.subject + (task.date ? " · " + task.date : "");

    const remove = document.createElement("button");
    remove.className = "danger task-delete";
    remove.textContent = "Delete";

    remove.addEventListener("click", () => {

      tasks = tasks.filter(item => item.id !== task.id);

      saveAll();
      renderTasks();

    });

    row.append(
      checkbox,
      title,
      info,
      remove
    );

    list.appendChild(row);

  });

}

/* CLEAR COMPLETED */

$("clearDone").addEventListener("click", () => {

  tasks = tasks.filter(task => !task.done);

  saveAll();
  renderTasks();

});

/* INITIAL LOAD */

renderSubjects();
renderTasks();

</script>

</body>
</html>
